# Project naming conventions
paths:
  migrations: "deploy/migrations/000XXX_name.{up,down}.sql"
  domain: "internal/domain/"
  repository: "internal/database/repository/"
  sqlc_queries: "internal/database/dbgen/{domain}db/query.sql"
  service: "internal/service/"
  handler: "internal/api/handler/"
  middleware: "internal/api/middleware/"
  dto: "internal/api/dto/"
  router: "internal/api/router/router.go"
  config: "internal/config/"
  tests: "internal/{package}/*_test.go"

# Specs per task
specs:
  dir: ".ai/specs"
  structure: "{task-slug}/FEATURE_SPEC.md + IMPLEMENTATION_TRACKER.md"

# Templates
templates:
  feature: ".ai/templates/FEATURE_SPEC.md"
  tracker: ".ai/templates/IMPLEMENTATION_TRACKER.md"

# Shared skills in repository
commands:
  feature-architect: ".ai/skills/feature-architect/SKILL.md"
  feature-checker: ".ai/skills/feature-checker/SKILL.md"
  feature-scaffold: ".ai/skills/feature-scaffold/SKILL.md"

# Agent runtime mirror path
runtime:
  skills_dir: ".agents/skills"

# Dependency rules
rules:
  - "Phase N+1 depends on Phase N"
  - "SQL queries depend on migrations"
  - "Handlers depend on Services and Repositories"
  - "Middleware must have tests before use"

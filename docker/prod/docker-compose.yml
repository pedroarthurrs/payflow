services:
  i9pay:
    build:
      context: ../../
      dockerfile: docker/prod/Dockerfile
    container_name: i9pay
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - ../../.env

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../../.env

volumes:
  postgres_data:
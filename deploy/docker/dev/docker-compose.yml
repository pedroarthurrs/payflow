services:
  api:
    build:
      context: ../../../
      dockerfile: build/docker/dev/Dockerfile
    container_name: api_dev
    ports:
      - "8080:8080"
    volumes:
      - ../../../:/app
    env_file:
      - ../../../.env
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - ../../migrations:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../../../.env

  web:
    build:
      context: ../../../
      dockerfile: build/docker/dev/Dockerfile.web
    container_name: web_dev
    ports:
      - "3000:3000"
    volumes:
      - ../../../web:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://api:8080
    depends_on:
      - api

  adminer:
    image: adminer
    ports:
      - 8081:8080

volumes:
  postgres_data:
